buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

// Redraw doc/controls/<opmode>.png (the gamepad diagrams) from the OpMode source on every full install
// (assembleDebug). Sloth deploys skip it: it takes a few seconds, more than the rest of a deploy.
// Runs tools/ControlLayout.java on the JDK Gradle itself uses. A problem there only prints a warning,
// so it can never stop a deploy.
def controlLayoutSource = rootProject.file('tools/ControlLayout.java')
def controlLayoutJava = new File(System.getProperty('java.home'), 'bin/java').absolutePath
def controlLayoutRoot = rootProject.projectDir
tasks.register('controlLayout') {
    group = 'documentation'
    description = 'Redraws doc/controls/<opmode>.png from the gamepad bindings in TeamCode.'
    inputs.dir('src/main/java')
    inputs.files(controlLayoutSource, rootProject.file('tools/control-labels.json'))
    outputs.dir(rootProject.file('doc/controls'))
    doLast {
        try {
            def proc = new ProcessBuilder(controlLayoutJava, '-Djava.awt.headless=true',
                    controlLayoutSource.absolutePath, '--quiet')
                    .directory(controlLayoutRoot).redirectErrorStream(true).start()
            def output = proc.inputStream.text.trim()
            if (proc.waitFor() == 0) {
                if (output) println output
            } else {
                logger.warn("Couldn't draw the control diagrams (tools/ControlLayout.java):\n${output}")
            }
        } catch (IOException e) {
            logger.warn("Couldn't draw the control diagrams (tools/ControlLayout.java): ${e.message}")
        }
    }
}
tasks.matching { it.name == 'assembleDebug' }.configureEach { dependsOn 'controlLayout' }

dependencies {
    implementation project(':FtcRobotController')

    // Sloth hot-reload runtime (Dairy Foundation). Deploy with the deploySloth gradle task.
    implementation("dev.frozenmilk.sinister:Sloth:0.3.2")
    // Panels dashboard (Lazar). Supports Sloth itself since 1.0.16 (it depends on the Sloth above)
    implementation("com.bylazar:fullpanels:1.0.19")

    // Unit tests for the hardware-free logic (src/test): ./gradlew :TeamCode:testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
}

// SimLoop: simulated tests on the laptop (simloop-starter/README.md)
apply from: "$rootDir/simloop-starter/simloop.gradle"
